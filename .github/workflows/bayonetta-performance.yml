name: Bayonetta Metal3 performance host
on:
  push:
    branches: [bayonetta-metal3-performance]
    paths: ['bayonetta-ci/**', '.github/workflows/bayonetta-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select the newest installed Xcode
        run: |
          latest=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          if ! command -v xcodegen; then brew install xcodegen; fi
          xcodebuild -version
      - name: Check resource declarations and build with empty module sections
        run: python3 bayonetta-ci/bayonetta-host-build.py --inputs bayonetta-ci --results "$RUNNER_TEMP/bayonetta-results"
      - name: Retain host and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bayonetta-Metal3-host-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bayonetta-results/*.log
            ${{ runner.temp }}/bayonetta-results/*.json
            ${{ runner.temp }}/bayonetta-results/Bayonetta-Metal3-host-placeholders.zip
          retention-days: 3
